<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <style>
      .title{font-family:Arial,'Noto Sans SC',sans-serif;font-size:38px;font-weight:700;fill:#0f172a}
      .label{font-family:Arial,'Noto Sans SC',sans-serif;font-size:25px;font-weight:700;fill:#0f172a}
      .small{font-family:Arial,'Noto Sans SC',sans-serif;font-size:20px;fill:#334155}
      .tiny{font-family:Arial,'Noto Sans SC',sans-serif;font-size:17px;fill:#475569}
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2.2;rx:12}
      .sam{fill:#ecfdf5;stroke:#047857;stroke-width:2.4;rx:12}
      .bev{fill:#eff6ff;stroke:#2563eb;stroke-width:2.4;rx:12}
      .out{fill:#fff7ed;stroke:#ea580c;stroke-width:2.4;rx:12}
      .note{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.5;rx:10}
      .arrow{stroke:#334155;stroke-width:2.8;fill:none;marker-end:url(#arrow)}
      .samArrow{stroke:#059669;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:2.4;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="70" y="70" class="title">SAM3 + BEVFormer Overall Architecture</text>
  <text x="70" y="105" class="small">SAM3 is added as query-level bias and BEV-level prior before the original BEVFormer transformer flow.</text>

  <rect x="70" y="170" width="220" height="120" class="box"/>
  <text x="180" y="215" text-anchor="middle" class="label">Multi-camera</text>
  <text x="180" y="250" text-anchor="middle" class="small">images</text>
  <text x="180" y="276" text-anchor="middle" class="tiny">I1 ... IV</text>

  <rect x="360" y="170" width="230" height="120" class="box"/>
  <text x="475" y="215" text-anchor="middle" class="label">Backbone</text>
  <text x="475" y="250" text-anchor="middle" class="small">image features F</text>

  <rect x="70" y="405" width="220" height="135" class="sam"/>
  <text x="180" y="445" text-anchor="middle" class="label">SAM3</text>
  <text x="180" y="478" text-anchor="middle" class="small">2D proposals</text>
  <text x="180" y="506" text-anchor="middle" class="tiny">box / score / class / mask</text>

  <rect x="360" y="405" width="240" height="135" class="sam"/>
  <text x="480" y="445" text-anchor="middle" class="label">13D Geometry</text>
  <text x="480" y="478" text-anchor="middle" class="small">proposal P</text>
  <text x="480" y="506" text-anchor="middle" class="tiny">cam id + ray + cam position</text>

  <rect x="680" y="155" width="260" height="145" class="bev"/>
  <text x="810" y="195" text-anchor="middle" class="label">BEV Query</text>
  <text x="810" y="228" text-anchor="middle" class="small">B0 + Gb(P)</text>
  <text x="810" y="258" text-anchor="middle" class="tiny">SAMBEVPriorEncoder</text>

  <rect x="680" y="390" width="260" height="160" class="bev"/>
  <text x="810" y="430" text-anchor="middle" class="label">Object Query</text>
  <text x="810" y="463" text-anchor="middle" class="small">Q0 + Gq(P)</text>
  <text x="810" y="493" text-anchor="middle" class="tiny">SAMProposalQueryEncoder</text>
  <text x="810" y="520" text-anchor="middle" class="tiny">pos delta + content delta</text>

  <rect x="1030" y="165" width="240" height="130" class="bev"/>
  <text x="1150" y="210" text-anchor="middle" class="label">BEV Encoder</text>
  <text x="1150" y="245" text-anchor="middle" class="small">B' = Enc(B0', F)</text>

  <rect x="1030" y="405" width="240" height="130" class="bev"/>
  <text x="1150" y="450" text-anchor="middle" class="label">Decoder</text>
  <text x="1150" y="485" text-anchor="middle" class="small">H' = Dec(Q0', B')</text>

  <rect x="1360" y="285" width="180" height="145" class="out"/>
  <text x="1450" y="330" text-anchor="middle" class="label">3D Head</text>
  <text x="1450" y="365" text-anchor="middle" class="small">class + box</text>
  <text x="1450" y="395" text-anchor="middle" class="tiny">p, b</text>

  <rect x="1080" y="650" width="290" height="120" class="note"/>
  <text x="1225" y="690" text-anchor="middle" class="label">Optional Stage-2</text>
  <text x="1225" y="724" text-anchor="middle" class="small">project 3D boxes to cameras</text>
  <text x="1225" y="752" text-anchor="middle" class="tiny">SAM3 support -> score refine</text>

  <path d="M290 230 L360 230" class="arrow"/>
  <path d="M590 230 L680 230" class="arrow"/>
  <path d="M940 230 L1030 230" class="arrow"/>
  <path d="M1270 230 C1320 230 1325 350 1360 350" class="arrow"/>
  <path d="M290 472 L360 472" class="samArrow"/>
  <path d="M600 472 L680 472" class="samArrow"/>
  <path d="M600 472 C640 472 640 230 680 230" class="samArrow"/>
  <path d="M940 470 L1030 470" class="arrow"/>
  <path d="M1150 295 L1150 405" class="arrow"/>
  <path d="M1270 470 C1320 470 1325 365 1360 365" class="arrow"/>
  <path d="M1450 430 C1450 615 1370 710 1370 710" class="dash"/>

  <rect x="70" y="650" width="650" height="120" class="note"/>
  <text x="95" y="690" class="label">Core replacement</text>
  <text x="95" y="725" class="small">Original: Head(Dec(Q0, Enc(B0, F)))</text>
  <text x="95" y="755" class="small">SAM3: Head(Dec(Q0 + Gq(P), Enc(B0 + Gb(P), F)))</text>
</svg>
